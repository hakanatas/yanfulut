<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nokta Nokta Flüt</title>
    <meta name="description" content="Yan flüt öğrenmek isteyenler için çizimli, etkileşimli video dersler ve nota-nokta şarkı oyunları." />
    <meta name="theme-color" content="#fff8ec" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♪</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Patrick+Hand&family=Noto+Music&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Elle çizim görünümü için ortak SVG filtresi -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <filter id="sketchy" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <!-- Küçük çizimler (porte, mini flüt) için daha hafif titreme -->
        <filter id="sketchy-sm" x="-5%" y="-20%" width="110%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="1" seed="5" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.7" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <!-- Çizim detayları: metal parlaklığı, cam, ten gölgesi ve kurşun kalem taraması -->
        <linearGradient id="g-metal" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" class="st-metal-lo" />
          <stop offset="0.28" class="st-metal-hi" />
          <stop offset="0.5" class="st-metal" />
          <stop offset="1" class="st-metal-lo" />
        </linearGradient>
        <radialGradient id="g-cup" cx="0.38" cy="0.32" r="0.75">
          <stop offset="0" class="st-metal-hi" />
          <stop offset="0.6" class="st-metal" />
          <stop offset="1" class="st-metal-lo" />
        </radialGradient>
        <radialGradient id="g-pressed" cx="0.38" cy="0.32" r="0.8">
          <stop offset="0" class="st-coral-hi" />
          <stop offset="1" class="st-coral" />
        </radialGradient>
        <linearGradient id="g-glass" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" class="st-glass-lo" />
          <stop offset="0.3" class="st-glass-hi" />
          <stop offset="0.55" class="st-glass" />
          <stop offset="1" class="st-glass-lo" />
        </linearGradient>
        <radialGradient id="g-skin" cx="0.4" cy="0.35" r="0.7">
          <stop offset="0" class="st-skin-hi" />
          <stop offset="1" class="st-skin" />
        </radialGradient>
        <radialGradient id="g-head" cx="0.35" cy="0.3" r="0.75">
          <stop offset="0" class="st-ink-hi" />
          <stop offset="1" class="st-ink" />
        </radialGradient>
        <linearGradient id="g-wood" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" class="st-wood-lo" />
          <stop offset="0.4" class="st-wood" />
          <stop offset="1" class="st-wood-lo" />
        </linearGradient>
        <radialGradient id="g-varnish" cx="0.42" cy="0.38" r="0.75">
          <stop offset="0" class="st-varnish-hi" />
          <stop offset="0.55" class="st-varnish" />
          <stop offset="1" class="st-varnish-lo" />
        </radialGradient>
        <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="6" class="hatch-line" />
        </pattern>
        <pattern id="hatch-x" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <path d="M0 0V7M0 0H7" class="hatch-line" />
        </pattern>
        <filter id="paper-grain" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="8" />
          <feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0.55 0" />
        </filter>
      </defs>
    </svg>

    <header class="topbar">
      <a class="logo" href="#/"><span class="logo-dot" aria-hidden="true">♪</span> <span class="logo-name">Nokta Nokta Flüt</span></a>
      <nav class="nav" aria-label="Ana menü">
        <a href="#/">Dersler</a>
        <a href="#/parmak">Parmak Tablosu</a>
        <a href="#/akort">Akort</a>
        <a class="other-instrument" href="keman/">Keman →</a>
      </nav>
    </header>

    <div class="embed-note" hidden>
      🎤 Bu önizlemede mikrofon çalışmaz. Flütünle çalıp notalarını dinletmek için
      <a href="https://hakanatas.github.io/yanfulut/" target="_blank" rel="noopener">uygulamayı tarayıcıda aç</a>.
    </div>
    <main id="view"></main>

    <footer class="footer">
      <span>Mikrofon yalnızca tarayıcında, çaldığın notayı tanımak için kullanılır; ses hiçbir yere gönderilmez.</span>
      <button class="link" id="reset-progress">İlerlemeyi sıfırla</button>
    </footer>

    <noscript>Bu uygulama için JavaScript gerekli.</noscript>
    <script type="module">
      import { boot } from './js/app.js';
      boot('flute');
    </script>
  </body>
</html>
